<div class="scanner-backdrop" (click)="close()">
  <div class="scanner-card" (click)="$event.stopPropagation()">
    <div class="scanner-head">
      <span>وجّه الكاميرا نحو الباركود</span>
      <button type="button" class="icon-btn" (click)="close()" aria-label="إغلاق">×</button>
    </div>

    @if (cameraError()) {
      <div class="camera-error">{{ cameraError() }}</div>
    } @else {
      <div class="video-wrap">
        <video #videoElement class="scanner-video" autoplay muted playsinline></video>
        <div class="scan-frame"></div>
        @if (starting()) {
          <div class="scanner-loading">جارٍ تشغيل الكاميرا…</div>
        }
      </div>
    }
  </div>
</div>
